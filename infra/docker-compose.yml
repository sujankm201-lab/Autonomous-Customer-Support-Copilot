version: '3.8'
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: support_copilot
    volumes:
      - ./data/mongo:/data/db

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    restart: unless-stopped
    volumes:
      - ./data/chroma:/chroma

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
    depends_on:
      - mongo
      - chroma

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: ["/bin/bash"]
